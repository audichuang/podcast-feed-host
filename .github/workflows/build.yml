name: build-and-push
# Build all three images and push to GHCR; the NAS only ever pulls.
#   podcast-feed-host      read  — Caddy static server (Caddyfile baked in as the default)
#   podcast-feed-uploader  write — token-gated PUT endpoint the publisher talks to
#   podcast-feed-dashboard admin — read-only catalog + delete (Pillow for thumbnails)
# NAS then `docker compose pull && up -d`; watchtower picks new images up on its own.
on:
  push:
    branches: [main]
    # `!**/*.md` 放最後(後面的 pattern 優先):純文件改動不該重建 image ——
    # metadata 帶 commit SHA,digest 一定不同,watchtower 就會去重建生產容器。
    paths: [Dockerfile, Caddyfile, "uploader/**", "dashboard/**",
            .github/workflows/build.yml, "!**/*.md"]
  workflow_dispatch:
permissions: {contents: read, packages: write}
jobs:
  # 兩支服務都是 stdlib-only + assert,沒有 framework、沒有 fixture。跑得夠快,
  # 所以讓它擋在 build 前面 —— 壞掉的 commit 不該推出一個 image 到 GHCR。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      # dashboard 的縮圖測試在沒有 Pillow 時會自己跳過 —— CI 裝上,讓它真的跑到
      - run: pip install --quiet pillow
      - run: python3 test_server.py
        working-directory: uploader
      - run: python3 test_server.py
        working-directory: dashboard

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: podcast-feed-host,     context: .,          file: ./Dockerfile}
          - {name: podcast-feed-uploader, context: ./uploader, file: ./uploader/Dockerfile}
          - {name: podcast-feed-dashboard, context: ./dashboard, file: ./dashboard/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
